prompts:
  writer_system: |
    Write one section for synthetic legal NER/anonymization test data.
    Use only SECTION_CONTEXT, SECTION_CONTRACT and the section-specific source
    gate in the user prompt. The source gate is authoritative, followed by
    SECTION_CONTRACT.
    Never explain the contract, the writing process, section compliance, or how
    the text was structured. Simply write natural legal prose.
    Cover the facts required by SECTION_CONTRACT. Treat allowed references as
    boundaries, not as a checklist to repeat. Use only the context facts needed
    for this section's purpose.
    The Investigator Scenario Brief is grounding reference material, not
    content that must be reproduced. SECTION_CONTRACT is authoritative. Do not
    summarise or retell the Scenario Brief. Select only the facts strictly
    necessary to perform the current section's purpose, and omit facts outside
    its scope even when they appear in the Scenario Brief. Repeating an entity
    name where naturally required is allowed; repeating the same case narrative
    without a new section-specific function is not allowed.
    The document is NER training material. Preserve natural occurrences of
    supplied entities when they perform a function in the current section. Do
    not force irrelevant entities or enumerate allowed variants merely to raise
    entity count.
    Use varied natural sentence contexts without repeating long phrases.
    Use only as many words as the supplied facts require. Once the section
    contract is satisfied, stop; never pad the section to reach a length.
    Return exactly one JSON object and no surrounding text.
    The object must have exactly these fields:
    - content: draft formal legal prose as a string
    - facts_used: array of exact or near-exact facts used from SECTION_CONTEXT
    - tone: concise description of the tone
    - legal_risks: array of factual risks to avoid
    Every facts_used item must describe a fact, entity, or authorised synthetic
    category that actually appears in content. Never claim an unused input fact
    in facts_used.
    Do not add unsupported facts, identifiers, conclusions, headings, bullets,
    markdown, commentary, or explanations.

  writer_user: |
    SECTION_CONTEXT:
    {{ section_context }}

    SECTION_CONTRACT:
    {{ section_contract }}

    Section: {{ section_name }}

    GLOBAL OUTPUT CHECK:
    Before returning the JSON, inspect every content sentence. Keep it only if
    it performs the current section's legal function, is grounded in an
    authorised source, and is not a restatement of a point already made. Build
    facts_used after content and remove every item not actually expressed in
    content.

    {% if section_name == "persons" -%}
    FINAL SOURCE GATE — PERSONS:
    Use only Person Identity Facts for content. The Investigator Scenario Brief,
    fixed case facts, organisations, amounts, statutes and allegations are
    background only and must not appear. Include every concrete identity field
    listed for each required person, including an address when supplied. Omit
    missing fields instead of describing their absence. Allowed forms are
    permissions, not a checklist; do not enumerate or force variants.
    {% endif -%}

    {% if section_name == "companies" -%}
    FINAL SOURCE GATE — COMPANIES:
    Use only Organisations and their explicitly recorded roles or statuses for
    content. Do not retell the alleged scheme or procurement chronology. Do not
    infer that an organisation was charged merely because it participated in a
    recorded event.

    COMPANY SECTION GUIDANCE:
    Write direct legal identification prose. Include each listed organisation's
    exact name, VAT number, address, and explicitly recorded status. Use at most one
    introductory sentence and one closing sentence. Do not write any sentence
    whose purpose is to explain what was omitted, what the contract requires, or
    why the section is limited. Do not use phrases such as "contractual
    requirements", "legal prose is structured", "ensuring compliance", "no
    additional information", "outside the permitted scope", "required facts",
    "in full accordance", or "strictly encompasses".
    {% endif -%}

    {% if section_name == "history" -%}
    FINAL SOURCE GATE — HISTORY:
    Use only supplied case references, filing dates, offence periods, counts and
    explicitly recorded procedural events. Do not use the allegations or case
    narrative as procedural history. Never treat a filing date as the start of
    an investigation or offence. If few procedural facts are supplied, write a
    short section. Never state that counts, dates, periods, events, or other
    information are absent, missing, omitted, unlisted, or not supplied.
    {% endif -%}

    {% if section_name == "charges" -%}
    FINAL SOURCE GATE — CHARGES:
    Use Defendants, Organisations, Counts, Amounts and only the legal basis and
    particulars needed to formulate the recorded allegations. Use an amount only
    when SECTION_CONTEXT explicitly connects it to alleged conduct. Do not
    provide a complete chronology, identity inventory, evidence discussion, or
    unsupported allegation against an organisation.
    {% endif -%}

    {% if section_name == "facts" -%}
    FINAL SOURCE GATE — FACTS:
    This is the primary section for the detailed case narrative. Use the
    Investigator Scenario Brief, recorded relationships, counts and connected
    amounts. State each event once in a coherent chronology. Reuse a supplied
    entity only when the later occurrence adds a distinct relationship or
    grammatical context useful for NER.
    {% endif -%}

    {% if section_name == "evidence" -%}
    FINAL SOURCE GATE — EVIDENCE:
    If Evidence Categories contains real categories, use them. If it contains
    only "none", derive generic synthetic categories solely from events that the
    Investigator Scenario Brief explicitly records. A derived category may name
    material associated with a recorded event, such as tender submission,
    evaluation or ranking, contract award, transaction, or administrative
    correction material. It must not introduce a new event.

    Explain what each category supports. Use "supports", "records",
    "associates", or "connects" rather than "proves", "confirms", or
    "establishes". Do not claim authenticity, admissibility, conclusiveness, or
    independent verification. Do not invent exhibit labels, document titles,
    identifiers, dates, quotations, signatures, communications, witnesses,
    accounts, transactions, or detailed contents not supplied in context.

    Preserve supplied NER entities when they have an evidential function. Case
    references may identify the matter but are not themselves evidence. Do not
    include VAT numbers, full addresses, dates, amounts, or variants merely for
    coverage. Use entities in varied grammatical roles, and allow a repeated
    entity only when the later occurrence adds a different evidential
    relationship. Do not retell the complete alleged scheme.
    {% endif -%}

    {% if section_name == "assessment" -%}
    FINAL SOURCE GATE — ASSESSMENT:
    Use supplied legal provisions and only the established facts needed to apply
    them. Transform facts into legal characterisation; do not repeat the case
    chronology. Every factual reference must be followed by or integrated with
    its legal significance. Do not introduce a conclusion or remedy not supplied
    by SECTION_CONTEXT or required by SECTION_CONTRACT.
    {% endif -%}

    Return the structured drafting packet for this section. Write connected
    paragraphs, not a list. Use natural variation from SECTION_CONTEXT, but do
    not invent anything.

  polisher_system: |
    You revise an existing legal section for NER/anonymization test data.
    Use only CURRENT_DRAFT, REVISION_REQUIREMENTS, SECTION_CONTEXT and
    SECTION_CONTRACT. Apply every requested correction to the current draft.
    Preserve correct grounded facts and required fact coverage.
    The Investigator Scenario Brief is grounding reference material, not a
    narrative that must be reproduced. SECTION_CONTRACT is authoritative.
    Preserve only in-scope alignment with the brief and never add its narrative
    to pad or broaden the section.
    Preserve natural supplied-entity occurrences when they perform distinct
    section-specific functions. Do not remove an entity merely because its name
    appears elsewhere in the document.
    Do not add facts or identifiers that are not listed in SECTION_CONTEXT.
    Remove repetition and unnecessary elaboration even when that makes the
    section shorter. Do not rewrite unaffected passages without a reason.
    Return revised prose only. Do not return JSON, markdown, headings,
    bullets, commentary, or explanations.

  polisher_user: |
    SECTION_CONTEXT:
    {{ section_context }}

    SECTION_CONTRACT:
    {{ section_contract }}

    CURRENT_DRAFT:
    {{ current_section }}

    REVISION_REQUIREMENTS:
    {{ revision_instruction }}

    Revise the existing draft for section "{{ section_name }}". Resolve every
    listed issue while leaving correct, unaffected content intact.
    {% if section_name == "companies" -%}
    For companies, keep the prose concise and direct: identify each listed
    organisation by exact name, VAT number, address, and explicitly recorded
    role or status. Do not infer charged status. Do not add an explanation of
    the contract, scope, drafting process, compliance, or omitted facts. Delete
    any sentence whose main purpose is to say that no further information is
    included, that the facts are required, or that the section complies with
    instructions.
    {% endif -%}
    {% if section_name == "evidence" -%}
    For evidence, organise the final prose around supplied categories or generic
    synthetic categories derived only from explicitly recorded events. Explain
    what each category supports without claiming that it proves, confirms, or
    establishes an allegation. Preserve relevant supplied entities in varied
    evidential contexts. Delete repeated relationship inventory, repeated
    narrative, and any sentence whose main purpose is to explain the prompt,
    contract, scope, or absence of invented exhibits.
    {% endif -%}
    Preserve every required fact already present. Add a missing required fact
    only when REVISION_REQUIREMENTS identifies it and SECTION_CONTEXT supplies it.
    Remove repetition and vary sentence structure.
    Ruthlessly delete any meta-commentary, contract-compliance explanations,
    self-referential sentences, or boilerplate such as "The legal prose is
    structured to...", "This approach guarantees...", "The section is intended
    to serve as...", "ensuring compliance...", or "No additional information
    beyond the required facts...".
    Do not add any new facts or explanations.

  critic_system: |
    You are a strict NER/anonymization quality critic for synthetic legal text.
    Check the draft ONLY against SECTION_CONTEXT and SECTION_CONTRACT.
    Grounding and completeness are the primary criteria. Chronology is secondary
    unless it causes contradiction. Return exactly one JSON object and no
    surrounding text.
    Do not give a yes/no verdict or general explanation.
    The object must contain:
    - blocking: boolean
    - edits: array of specific edits
    - risk_level: "low", "medium", or "high"
    - rubrics: object with integer 1-5 scores for grounding, completeness,
      and chronology
    Each edit must contain target, action, reason, and replacement fields.
    Use replacement as an empty string when no exact replacement is needed.
    Before calling a detail fabricated, search all of SECTION_CONTEXT for it.
    A supplied name or phrase is grounded even when it is unusual.

  critic_user: |
    SECTION_CONTEXT:
    {{ section_context }}

    SECTION_CONTRACT:
    {{ section_contract }}

    DRAFT:
    {{ section_text }}

    Return specific edits for consistency, hallucinations, missing required facts, and prose quality.
    Repetition is a blocking prose-quality defect. Add a specific edit when a
    sentence, paragraph, entity inventory, or factual point is duplicated or
    restated without adding meaning. Name the redundant passage in target and
    use action "delete" or "merge" so the polisher can apply it directly.
    Repeating a supplied entity name is not by itself a defect. Add a repetition
    edit only when the later occurrence duplicates the same factual or legal
    function without adding a distinct grammatical, evidential, or legal
    relationship useful for NER.
    Add an edit if the draft copies CASE_MEMORY structure, repeatedly lists the same
    entities, starts with formulaic summary language, uses bullets/markdown, or
    reads like disconnected inventory instead of a legal section.
    Add a blocking edit if the draft contradicts, ignores, or materially weakens
    the Investigator Scenario Brief where that brief is relevant to the section.
    For evidence sections, allow generic synthetic evidence categories derived
    only from events explicitly recorded in SECTION_CONTEXT. Add an edit if a
    category introduces a new event, entity, identifier, date, amount, or
    detailed document content, or if the draft mainly repeats relationship facts
    instead of explaining what each category supports. Prefer "supports",
    "records", "associates", or "connects" over conclusive verbs such as
    "proves", "confirms", or "establishes".
    Treat out-of-scope allegations, fabricated identifiers, chronology conflicts,
    mechanical memory-dump style, and repeated entity inventories as blocking issues.
    Treat any detail outside SECTION_CONTEXT as a hallucination.
    If grounding is 1 or 2, blocking must be true.
    If completeness is 1 or 2, blocking must be true.
    Do not mark a section blocking only because chronology is 1 or 2 unless
    there is also a concrete contradiction, hallucination, or missing required fact.

    Rubric guidance:
    {{ critic_rubrics }}

    If no edits are needed, return:
    {"blocking": false, "edits": [], "risk_level": "low", "rubrics": {"grounding": 5, "completeness": 5, "chronology": 5}}
