[tool.poetry]
name = "synthetic-ner"
version = "0.1.0"
description = "Synthetic legal document NER dataset generator"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
faker = ">=24.0.0"
jinja2 = ">=3.1.0"
mlflow = "3.14.0"
langgraph = ">=0.2.0"
prefect = { version = "3.7.8", python = ">=3.11,<3.14" }
pyyaml = ">=6.0"
requests = ">=2.31.0"

[tool.poetry.group.dev.dependencies]
bandit = ">=1.9.0,<2"
pip-audit = ">=2.10.0,<3"
pre-commit = ">=4.6.0,<5"
pytest = ">=8.0.0"
pytest-cov = ">=7.0.0,<8"
radon = ">=6.0.0"
ruff = ">=0.11.0"
vulture = "^2.16"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["C90", "E", "F", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.run]
branch = true
source = ["src.synthetic_ner"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
