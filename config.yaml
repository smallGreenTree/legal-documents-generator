paths:
  output_dir: output
  memory_dir: memory

model_routing:
  stages:
    writer:
      provider: ollama
      base_url: http://localhost:11434
      model: qwen3.6:27b
      num_ctx: 8192
      think: false
      top_p: 0.9
      timeout: 900
      recovery:
        max_generate_attempts: 1
        retry_backoff_seconds: 5
        controlled_empty_section: "[section not generated - ERROR dude]"
    polisher:
      provider: ollama
      base_url: http://localhost:11434
      model: qwen3.6:27b
      num_ctx: 8192
      think: false
      top_p: 0.9
      timeout: 900
      recovery:
        max_generate_attempts: 1
        retry_backoff_seconds: 5
        controlled_empty_section: "[section not generated - ERROR dude]"

    critic:
      provider: ollama
      base_url: http://localhost:11434
      model: qwen3.6:27b
      num_ctx: 8192
      think: false
      top_p: 0.9
      timeout: 900
      recovery:
        max_generate_attempts: 1
        retry_backoff_seconds: 5
        controlled_empty_section: "[section not generated- ERROR dude]"
    morphology:
      provider: ollama
      base_url: http://localhost:11434
      model: qwen3.6:27b
      num_ctx: 8192
      think: false
      top_p: 0.9
      timeout: 900
      recovery:
        max_generate_attempts: 1
        retry_backoff_seconds: 5
        controlled_empty_section: "[morphology variation not generated]"

mlflow:
  enabled: true
  tracking_uri: http://localhost:5000
  experiment_name: ner-platform
  service_name: synthetic-dataset-generation
  pipeline_stage: synthetic_dataset_generation
  trace_name: document-workflow
  prompt_name_prefix: synthetic_ner
  prompt_alias: production

generation:
  words_per_page: 500

augmentation:
  temperature: 0.2
  style_temperature: 0.8
  style_retry_temperature: 0.2
  style_maximum_change_ratio: 0.95
  style_max_chunk_chars: 1800
  style_max_protected_tokens: 8
  style_max_sentences_per_chunk: 6
  max_output_tokens: 2500
  max_chunk_chars: 3000
  max_chunk_attempts: 2
  minimum_change_ratio: 0.01
  deterministic_minimum_change_ratio: 0.0001
  maximum_change_ratio: 0.45
  typo_rate: 0.005
  max_typos: 10
  layout_widths: [72, 88, 100]
  prompts_config_path: prompts/morphology_prompts.yaml

entity_variants:
  persons:
    enabled: true
    generation:
      nickname_variants: 2
      misspelling_variants: 2
      locale_aware: false

workflow:
  mode: langgraph
  max_revisions: 2
  memory_summary_chars: 900
  prefect_dialogue:
    generated_case_config_pattern: config_case/generated/{doc_id}.yaml

  validators:
    # Necessary deterministic safety checks.
    empty_section: true
    placeholder_text: true
    hidden_reasoning_markup: true
    placeholder_markers: true
    review_metadata: true
    markdown_formatting: true
    required_person_facts: true
    required_company_facts: true
    known_entity_presence: true
    unknown_case_references: true
    unknown_dates: true
    unknown_amounts: true
    unknown_vat_numbers: true
    unknown_organisations: true
    unknown_titled_people: true
    unknown_initials: true
    repeated_long_sentences: true
    repeated_sentence_fragments: true

    # Optional/legacy prose-shaping checks.
    meta_summary_style: false
    incomplete_date_range: false
    dangling_between_phrase: false
    unresolved_timeline_placeholder: false
    partial_vat_identifier: false
    truncated_sentence: false
    facts_contract: false

  writer:
    active: true
    temperature: 0.6
    max_output_tokens: 2500

  polisher:
    active: true
    temperature: 0.0
    max_output_tokens: 2500

  critic:
    active: true
    acceptance_threshold: 3.5
    temperature: 0.0
    max_output_tokens: 1200
    memory_char_limit: 6000
    section_text_char_limit: 3500
    rubrics:
      grounding: "1-5"
      completeness: "1-5"
      chronology: "1-5"

  prompts_config_path: prompts/workflow_prompts.yaml
